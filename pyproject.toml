[project]
name = "fission-benchmark"
version = "1.0.0"
description = "Local, DecBench-style benchmark for the Fission decompiler"
requires-python = ">=3.11"
dependencies = [
    # Not on PyPI. Provides the real GED / type_match / byte_match metrics.
    "decbench @ git+https://github.com/Noelo-Lab/decbench.git@325046fd48c7c5338f140e6de4daaf72f9991884",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["fbench"]

[project.scripts]
fbench = "fbench.cli:main"
